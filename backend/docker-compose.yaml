version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: rasar_system_postgres
    environment:
      POSTGRES_USER: rasaruser
      POSTGRES_PASSWORD: rasarpass
      POSTGRES_DB: rasardb
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: